name: nuDesk Ops Studio CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests & Code Integrity (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Compilation
        run: |
          python -m py_compile app.py auth_rbac.py ai_engine.py crm_dispatcher.py database.py document_reader.py meeting_queue.py mock_data.py models.py styles/nudesk_theme.py synthetic_datasets.py agent_guardrails.py inbound_api.py

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
